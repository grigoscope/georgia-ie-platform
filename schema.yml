openapi: 3.0.3
info:
  title: Georgia IE Platform API
  version: 1.0.0
  description: Документация для API платформы Georgia IE
paths:
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Проверка работоспособности БД
      tags:
      - health
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
